services:
  mongo:
    image: mongo
    container_name: bookent_db
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - 27017:27017

  redis:
    image: redis:latest
    container_name: bookent_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  server:
    build: ./server
    container_name: bookent_server
    ports:
      - 3000:3000
    env_file:
      - ./server/.env.development
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
    depends_on:
      - mongo
      - redis

volumes:
  mongo-data:
  redis-data:
  server-node-modules:
