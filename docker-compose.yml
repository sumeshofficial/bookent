services:
  mongo:
    image: mongo:latest
    container_name: bookent_db
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - 27017:27017

  redis:
    image: redis:latest
    container_name: bookent_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  server:
    build: ./server
    container_name: bookent_server
    ports:
      - 3000:3000
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo

  client:
    build: ./client
    container_name: bookent_client
    ports:
      - 5173:5173
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mongo-data:
  redis-data:
